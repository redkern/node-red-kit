name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  redis-cluster:
    name: Redis Cluster TLS and failover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run test:integration:cluster

  test:
    name: Node ${{ matrix.node }} / Node-RED ${{ matrix.node-red }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        node-red: ['4.1.15', '5.0.7']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select Node-RED matrix version
        run: npm install --no-save --package-lock=false "node-red@${{ matrix.node-red }}"
      - run: npm test
      - run: npm run test:integration
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
      - run: npm run test:consumer-types
      - run: npm run typecheck
      - name: Verify generated declarations
        run: git diff --exit-code -- index.d.ts redis.d.ts lib/*.d.ts && test -z "$(git ls-files --others --exclude-standard -- '*.d.ts')"
      - run: npm run lint:runtime
      - uses: ./.github/actions/check-req-ids
      - uses: ./.github/actions/check-pack
      - run: npm run test:coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Report development dependency advisories
        run: npm audit
        continue-on-error: true
      - run: npm ls --omit=dev
      - run: npm pack --dry-run --json